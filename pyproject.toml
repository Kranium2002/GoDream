[project]
name = "learned-judgment"
version = "0.1.0"
description = "Hackathon scaffold for Go2 high-level decision learning with PFN"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "scipy>=1.15,<2",
    "threadpoolctl>=3,<4",
    "PyYAML>=6,<7",
    "tabpfn-client==0.10.1",
    "python-dotenv==1.2.4",
    "torch==2.15.0",
    "snntorch==1.0.0",
]

[tool.uv]
package = false

# CPU-only PyTorch on every platform (verified in experiments/proofs/E15_snn_contract).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
