[project]
name = "learned-judgment"
version = "0.1.0"
description = "Hackathon scaffold for Go2 high-level decision learning with PFN"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "PyYAML>=6,<7",
    "tabpfn-client==0.10.1",
    "python-dotenv==1.2.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
