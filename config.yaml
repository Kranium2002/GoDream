project:
  name: Learned Judgment
  status: scaffold
  primary_skill: dodge
  no_substitute_robot_or_project: true

runtime:
  python: "3.13"
  simulator: mujoco
  headless: true
  seed: 20261121
  # The model's effective timestep: neither go2.xml nor scene.xml (unitree_mujoco@1eb6642) sets <option timestep>,
  # mujoco 3.11.0 loads both with opt.timestep 0.002 (MuJoCo's default), and the E1 proof printed
  # "timestep=0.002 substeps=10" (artifacts/env/20261121T144656-e1-proof/stdout.txt).
  timestep_s: 0.002

robot:
  model: unitree_go2
  # Unitree's own MJCF (BSD-3-Clause) from the integrator's git submodule third_party/unitree_mujoco, pinned at
  # `revision`. Initialise it with: git submodule update --init --depth 1 third_party/unitree_mujoco
  # sha256 is of go2.xml with CRLF normalised to LF (core.autocrlf may check it out with CRLF), i.e. the upstream blob.
  model_asset:
    path: third_party/unitree_mujoco/unitree_robots/go2/go2.xml
    source: https://github.com/unitreerobotics/unitree_mujoco/tree/1eb6642e3f3fdfb7fb13a9794fd6a2dd93ea0e7d/unitree_robots/go2
    revision: 1eb6642e3f3fdfb7fb13a9794fd6a2dd93ea0e7d
    sha256: 2014a3d76e30f17ab9447d8a67bd015291f74fa4d71ae30d005f1a32bd693d4b
  walking_policy:
    # verified: the command fields and ranges in command_schema below were each proven by a recorded run (E4). It says
    # nothing about speed-tracking accuracy: see experiments/EXPERIMENTS_LOG.md, "Gate 1 — locomotion acceptance".
    status: verified
    # Efferent examples/go2_walk at f51e1af, vendored byte-for-byte. The ONNX inside go2_walk.app is a conversion of
    # rl_sar policy/go2/robot_lab/policy.pt (rl_sar 376d42c9, Apache-2.0). E1 proof: artifacts/env/20261121T144656-e1-proof.
    source: https://github.com/Eximius-Labs/efferent/tree/f51e1af953afe1016dae9ceeff2b5328fa51781d/examples/go2_walk
    repository_revision: f51e1af953afe1016dae9ceeff2b5328fa51781d
    checkpoint: learned_judgment/env/assets/efferent@f51e1af/go2_walk.app
    checkpoint_sha256: 89a5bb7e1ff1cc4cd60f4855bf1dd77bd1b313aeee7c19e984fe7c6e37d74147
    # The second entry is a member of the go2_walk.app zip. go2.robot.yaml names "backend: id: mock"; the E1 proof
    # does not use it: it passes efferent's MujocoBackend to the Runner itself.
    matching_config:
      - learned_judgment/env/assets/efferent@f51e1af/go2.robot.yaml
      - learned_judgment/env/assets/efferent@f51e1af/go2_walk.app/manifest.yaml
    license: Apache-2.0
    # Read from manifest.yaml inside go2_walk.app (efferent@f51e1af), key "observation", in this order. The manifest
    # leaves dim null; each term's size gives 3+3+3+12+12+12 = 45, the obs_dim the E1 proof printed.
    # The manifest also sets normalization.clip_obs 100.0.
    observation_schema:
      - {name: base_ang_vel, dim: 3, scale: 0.25}
      - {name: projected_gravity, dim: 3, scale: 1.0}
      - {name: command, dim: 3, scale: [1.0, 1.0, 1.0]}  # names: vel_x, vel_y, yaw_rate
      - {name: joint_pos_rel, dim: 12, scale: 1.0}
      - {name: joint_vel, dim: 12, scale: 0.05}
      - {name: last_action, dim: 12, scale: 1.0}
    # manifest.yaml "control": action_type joint_position_delta (target = default_pose + action * scale),
    # clip_actions [-100.0, 100.0], gains kp/kd; "joints": names and defaults. torque_limit: go2.robot.yaml
    # (efferent@f51e1af) "joints[].torque_limit". go2.xml's own motor ctrlrange is 23.7 (hip, thigh) and 45.43 (calf).
    action_schema:
      dim: 12
      # Policy order FR, FL, RR, RL. go2.xml <actuator> (lines 223-234) has the same order: actuator i is policy joint i.
      # The model's joints follow its body tree, FL, FR, RL, RR (go2.xml lines 82-206), so policy joint i is
      # qpos[7 + [3, 4, 5, 0, 1, 2, 9, 10, 11, 6, 7, 8][i]] (the first 7 qpos are the free joint).
      joint_order: [FR_hip_joint, FR_thigh_joint, FR_calf_joint, FL_hip_joint, FL_thigh_joint, FL_calf_joint,
                    RR_hip_joint, RR_thigh_joint, RR_calf_joint, RL_hip_joint, RL_thigh_joint, RL_calf_joint]
      scale: [0.125, 0.25, 0.25, 0.125, 0.25, 0.25, 0.125, 0.25, 0.25, 0.125, 0.25, 0.25]
      default_pose: [0.0, 0.8, -1.5, 0.0, 0.8, -1.5, 0.0, 0.8, -1.5, 0.0, 0.8, -1.5]
      kp: [20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0]
      kd: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
      torque_limit: [23.5, 23.5, 23.5, 23.5, 23.5, 23.5, 23.5, 23.5, 23.5, 23.5, 23.5, 23.5]
    control_rate_hz: 50.0  # manifest.yaml control.rate_hz
    command_schema:
      update_period_s: 0.02  # 1 / control_rate_hz: the policy reads one command per 50 Hz control step
      source: >-
        Names and native order: manifest.yaml inside go2_walk.app (efferent@f51e1af), observation term "command",
        names [vel_x, vel_y, yaw_rate], scale 1.0 (lines 95-104); rate_hz 50.0 (line 11). Candidate range -1 to 1 for
        each field: robot_lab's current Go2 training range (experiments/EXPERIMENTS_LOG.md, "E1 (research half)"; the
        robot_lab commit this checkpoint was trained at is unknown). Each range end proven by a recorded run:
        experiments/EXPERIMENTS_LOG.md, "E4 — command inventory".
      # Per field: proven_by is the proof run's output; measured_at_min / measured_at_max are its signed responses
      # (m/s or rad/s, mean over the 10 s run after the first 5 s), rounded to 4 decimals.
      fields:
        vel_x:
          unit: m/s
          min: -1.0
          max: 1.0
          native_index: 0
          proven_by: artifacts/env/commands/commands.json
          measured_at_min: -0.8880
          measured_at_max: 0.9243
          description: >-
            Forward velocity in the dog's own heading frame (x forward): positive walks forward, negative walks
            backward. Tracking on a flat floor (Gate 1, experiments/EXPERIMENTS_LOG.md): commanded 0.3 / 0.6 / 0.9
            m/s gave 0.2256 / 0.5430 / 0.8596 m/s, so 0.3 m/s runs 0.0744 m/s slow, outside the gate's 20%
            tolerance (the one condition of Gate 1 that failed). In
            robot_lab training (HEAD; this checkpoint's training commit is unknown) planar commands with norm up to
            0.2 m/s were zeroed, so small commands may not move the dog as asked.
        vel_y:
          unit: m/s
          min: -1.0
          max: 1.0
          native_index: 1
          proven_by: artifacts/env/commands/commands.json
          measured_at_min: -1.0349
          measured_at_max: 0.8939
          description: >-
            Sideways velocity in the dog's own heading frame (y left): positive steps left, negative steps right.
            Tracking is measured only by the two proof runs (measured_at_min, measured_at_max). The same training
            note as vel_x applies to planar commands with norm up to 0.2 m/s.
        yaw_rate:
          unit: rad/s
          min: -1.0
          max: 1.0
          native_index: 2
          proven_by: artifacts/env/commands/commands.json
          measured_at_min: -0.9555
          measured_at_max: 0.9687
          description: >-
            Turning rate about the vertical axis: positive turns anticlockwise (to the left) seen from above. Gate 1
            measured +0.4976 / -0.5066 rad/s for +0.5 / -0.5 commanded at 0.3 m/s forward. With zero commanded the
            dog still turns anticlockwise at 0.05-0.14 rad/s (Gate 1). In robot_lab training yaw commands came from
            heading control.
  acceptance:
    trot_duration_s: 30
    commanded_speeds_m_s: [0.3, 0.6, 0.9]
    # rad/s. robot_lab's current Go2 training range for yaw_rate; the robot_lab commit this checkpoint was trained
    # at is unknown (experiments/EXPERIMENTS_LOG.md, E1 research half). The turn condition commands half of it.
    yaw_rates_supported_by_policy: [-1.0, 1.0]
    must_turn: true
    must_stop: true
    must_remain_standing: true
    # Tolerances fixed in the plan (Task 2) before any run.
    speed_tolerance_fraction: 0.2
    yaw_tolerance_fraction: 0.3
    stop_speed_m_s: 0.05
    # Measurement definitions, fixed with the tolerances: means exclude the first 5 s of the commanded run, final
    # speed is the mean planar speed over its last 2 s, and the dog has fallen if a trunk geom touches the floor
    # or the trunk tilts more than 60 degrees at any physics step of the commanded run.
    exclude_first_s: 5
    final_window_s: 2
    fall_tilt_deg: 60

world:
  hidden_effects:
    payload_mass_kg: [0.0, 3.0]
    payload_off_center_range_m: null  # Requires an explicit experimental range.
    declared_mass_error_fraction: [-0.2, 0.2]
    surface_friction_by_type: null  # Copy values from the verified MuJoCo model/config.
    friction_per_run_variation: null
    slope_deg: [-5.0, 5.0]
    motor_strength_fraction: [0.8, 1.0]
    command_latency_s: [0.05, 0.3]
    command_latency_jitter_s: null  # Measure/verify before setting.
  presets:
    default:
      payload_mass_kg: null
      floor_type: null
      slope_deg: null
      motor_strength_fraction: null
      command_latency_s: null
    heavy_payload:
      payload_mass_kg: null
      floor_type: null
      slope_deg: null
      motor_strength_fraction: null
      command_latency_s: null
    slippery_floor:
      payload_mass_kg: null
      floor_type: null
      slope_deg: null
      motor_strength_fraction: null
      command_latency_s: null
    tired_motors:
      payload_mass_kg: null
      floor_type: null
      slope_deg: null
      motor_strength_fraction: null
      command_latency_s: null
    downhill:
      payload_mass_kg: null
      floor_type: null
      slope_deg: null
      motor_strength_fraction: null
      command_latency_s: null

ball:
  enabled: true
  # IHF size 3 handball (resin), IHF Rules of the Game 1 July 2025, Rule 3:2: 425-475 g, circumference 58-60 cm.
  # Mid-range values; radius = 0.59 m / (2*pi). Evidence: experiments/EXPERIMENTS_LOG.md entry E6.
  spec: ihf_size_3_handball
  mass_kg: 0.450
  radius_m: 0.0939
  throw_origin_range_m: null
  throw_speed_range_m_s: null
  throw_direction_range_deg: null
  collision_masks: null

skills:
  dodge:
    status: primary
    attempts_per_skill_target: [10, 40]
    supported_action_schema: null  # Filled only after command-interface verification.
    # Candidate grid resolution per action dimension, in action order: side velocity, start delay, hold duration.
    candidate_points_per_dim: [9, 4, 3]
    # Action space. Names of the command fields follow Person A's answer (HANDOFF_PERSON_A.md); they are looked up
    # in the verified command schema, and the SkillSpec refuses to build until that schema is verified.
    action:
      side_velocity_field: vel_y  # Sideways speed; its sign picks the dodge side. Range: the field's verified range.
      forward_velocity_field: vel_x  # Held at the dog's forward speed during the whole episode.
      yaw_rate_field: yaw_rate  # Held at 0 during the whole episode.
      start_delay_s: [0.0, 0.6]  # Wait after the decision instant before the dodge command. Starting value; tune on dev.
      hold_duration_s: [0.2, 1.0]  # How long the dodge command is held. Starting value; tune on dev.
    episode_duration_s: null  # Total simulated time per attempt; set with Person A's ball flight times.
    # Observed situation ranges. Person A publishes the ball ranges with the throw model; all null until then.
    situation_ranges:
      ball_rel_x_m: null
      ball_rel_y_m: null
      ball_rel_z_m: null
      ball_vel_x_m_s: null
      ball_vel_y_m_s: null
      ball_vel_z_m_s: null
      dog_forward_speed_m_s: null
      declared_payload_kg: [0.0, 3.6]  # Payload 0-3 kg with a declared label up to 20% wrong (MISSION.md).
    declared_surfaces: null  # Level names of the declared floor type, from Person A's presets.
    # Constants of the physics guess (a straight-line dog and a ballistic ball). The residual model absorbs the rest.
    physics:
      gravity_m_s2: 9.81  # MuJoCo model default, config runtime.
      assumed_latency_s: 0.15  # Command latency the formula assumes; the true latency is hidden (0.05-0.3 s).
      time_step_s: 0.02  # Step of the closest-approach search; equals the 50 Hz control period.
      collision_softness_m: 0.05  # Width of the logistic that turns predicted clearance into a collision probability.
      body_half_length_m: null  # Half length of the trunk along x, from the verified Go2 model.
      body_radius_m: null  # Radius of the capsule around the trunk, from the verified Go2 model.
      base_height_m: null  # Height of the base above the floor while trotting, from a verified run.
    # Risk-aware objective, higher is better. Starting weights, fixed before any data; tune on dev data only.
    objective_weights:
      collision: 10.0  # Per unit of predicted collision probability.
      fall: 10.0  # Per unit of predicted fall probability.
      separation: 1.0  # Per metre of the low predictive quantile of closest separation, up to separation_cap_m.
      separation_cap_m: 0.5
      contact_margin_m: 0.02  # Clearance below this counts as contact when reading the separation distribution.
      motion: 0.5  # Per metre of commanded sideways travel (speed x hold time).
      recovery: 0.5  # Per second of predicted recovery time.
    confidence_threshold: null  # Select on dev data.
  brake:
    status: planned
  turn:
    status: planned
  ramp:
    status: planned
  kick:
    status: stretch

engine:
  candidate_batch_size: null  # Determine with verified API limits and dev runs.
  quantile_levels: [0.1, 0.25, 0.5, 0.75, 0.9]  # Predictive quantiles requested from every residual model.
  spread_levels: [0.1, 0.9]  # Predictive spread = half the width between these two levels.
  multi_outcome_mode: stacked  # stacked: one request for all outcomes; per_outcome: one request per outcome. Compare on dev.
  spec_validation:
    probe_situations: 16
    probe_points_per_dim: 3
  attempt_exploration_fraction: 0.5  # Share of context attempts using a random candidate instead of the physics action; choose on dev.
  attempts_dir: results/attempts  # Append-only attempt rows, one JSON Lines file per run.
  dreams_dir: results/dreams
  dreams_per_skill_initial: 2000
  confidence_thresholds_by_skill: null
  adaptation_context_policy: null  # Compare all/recent/world-ID on dev sets.
  adaptation_recent_window: null  # Attempts kept by the recent-only policy; choose on dev.

evaluation:
  dev_situations_per_skill: 100
  test_situations_per_skill: 100
  shift_situations_per_preset: 100  # Independent shift set per world preset (03_METRICS.md).
  test_access_log: results/test_access_log.jsonl  # Every read of a sealed test split is appended here.
  oracle_situations_per_skill: 100
  minimum_seeds: 3
  preferred_seeds: 5
  context_attempt_counts: [0, 5, 10, 20, 40]
  adaptation_new_attempt_counts: [0, 5, 10, 15, 20]
  recovery_tolerance_fraction: 0.2  # Recovered = within 20% of pre-shift error (03_METRICS.md).
  dream_counts: [100, 1000, 2000, 10000]
  coverage_intervals: [[0.25, 0.75], [0.1, 0.9]]  # 50% and 80% central intervals; members of engine.quantile_levels.
  bootstrap_resamples: 9999
  bootstrap_confidence_level: 0.95
  bootstrap_method: BCa  # Falls back to percentile, and records it, when BCa is degenerate.
  latency_decisions: 1000
  reliability_bins: 10  # Probability bins of the reliability table for binary outcomes.
  methods:  # Every method of 03_METRICS.md; the final table shows NOT RUN for each one without a saved result.
    - oracle
    - physics_only
    - constant_bias
    - gaussian_process
    - gradient_boosting
    - mlp_on_attempts
    - direct_tabpfn
    - teacher
    - snn_per_skill
    - snn_shared

tabpfn:
  client_version: "0.10.1"
  check_usage_before_uncached_request: true
  estimate_cost_before_uncached_request: true
  cache_requests_and_responses: true
  cache_key_fields:
    - training_features
    - training_targets
    - query_features
    - output_type
    - model_settings
  verified_request_limit_per_minute: null
  verified_request_limit_per_hour: null
  current_usage: null  # Read live before a billable run; never hardcode.
  # Model settings below are pinned so the server cannot change them silently; all enter the cache key.
  model_path: v3.5_default  # Server default family on 2026-11-21 (E7 proof p2_auth_usage.txt).
  n_estimators: 8  # Server default and cap for v3.5 (E7 proof p3_cost_estimates.txt).
  random_state: 0
  cache_dir: .cache/tabpfn  # Git-ignored. One entry per request hash: request, response, quote, usage.
  call_log: results/tabpfn_calls.jsonl  # One line per call or cache hit; never contains credentials.
  max_tokens_per_request: 10000  # Refuse an uncached request quoted above this (10000 = minimum charge, E7).
  max_query_rows_per_request: 32000  # Larger query sets are split into requests of at most this many rows. 32000 rows at 40 training rows still quoted the minimum charge (E7 proof p3b_cost_scaling.txt).
  lock_timeout_s: 120  # How long a process waits for another process using the same cache before giving up.
  project_token_budget: 35000000  # Total tokens this project may spend. Set by the lead on 2026-11-21: the allowance Prior Labs gave for the track.

persistence:  # Retry of the atomic file move on Windows, where an open reader blocks os.replace (proof p10_persist).
  replace_attempts: 10
  replace_pause_s: 0.05

baselines:  # Starting settings from the B-contract proofs; change only from dev results.
  gaussian_process:
    n_restarts_optimizer: 5
    constant_value_bounds: [0.001, 1000.0]
    length_scale_bounds: [0.01, 1000.0]
    noise_level_bounds: [0.000001, 10.0]
    min_attempts: 2  # Raises at 0 rows and is overconfident at 1 row (proof p04_gp).
  gradient_boosting:
    max_iter: 200
    learning_rate: 0.05
    max_leaf_nodes: 4
    min_samples_leaf: 2  # The library default of 20 gives a constant model below 40 rows (proof p05_gb).
    min_attempts: 5
    interval_folds: 5  # Predictive quantiles come from out-of-fold errors (review finding: in-sample intervals were far too narrow).
  mlp_on_attempts:
    hidden_layer_sizes: [64, 64]
    alpha: 0.0001
    max_iter: 2000
    min_attempts: 5
    interval_folds: 5  # Predictive quantiles come from out-of-fold errors (review finding: in-sample intervals collapsed to a point).

students:
  kind: snn  # The only student is a spiking neural network (decision 2026-11-21).
  per_skill_snn: true
  shared_snn: true
  dream_rehearsal: true
  snn:  # Starting values from the E15 fixture proofs (mechanics only, not results). Tune on dev data only.
    hidden_sizes: [64]  # Compare 16/32/64 and one/two layers on dev (E11).
    time_steps: 10  # Literature uses about 4-8 for direct encoding; proofs ran 5/10/25.
    beta: 0.9  # Membrane leak of the hidden layers.
    threshold: 1.0
    readout_beta: 0.9
    learn_beta: false
    learn_threshold: false
    surrogate: atan  # snnTorch default surrogate gradient.
    surrogate_alpha: 2.0
    target_temperature: 0.5  # Dream scores are divided by (temperature x their typical spread) before the softmax target.
    spike_rate_penalty: 0.0  # Weight of the mean firing rate in the loss; raises sparsity when above 0.
    learning_rate: 0.002
    batch_size: 64
    max_steps: 1500
    validation_fraction: 0.1
    evaluate_every_steps: 100
    patience_evaluations: 5  # Stop after this many evaluations without a better validation loss.
    torch_threads: 1  # Training was bitwise reproducible at 1 and 4 threads, not at 16 (proof p04_determinism).
    shared_skills: [dodge, brake, turn, ramp]  # Fixed order of the shared network's skill ID.
    shared_feature_width: null  # Encoded situation width reserved per skill in the shared network; set when the specs exist.
    rehearsal_fraction: 0.5  # Share of each shared-network batch drawn from earlier skills' stored dreams.
    energy:  # Estimate only. Horowitz, ISSCC 2014, Fig. 1.1.9, 45 nm 0.9 V, doi:10.1109/ISSCC.2014.6757323.
      precision: fp32
      e_mac_pj: 4.6  # 32-bit float multiply 3.7 pJ + add 0.9 pJ.
      e_ac_pj: 0.9  # 32-bit float add.
      source: "Horowitz, ISSCC 2014, Fig. 1.1.9 (45 nm, 0.9 V), doi:10.1109/ISSCC.2014.6757323"
