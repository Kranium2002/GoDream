    command_schema:
      update_period_s: 0.02
      source: "Names and native order: manifest.yaml inside go2_walk.app (efferent@f51e1af),\
        \ observation term \"command\", names [vel_x, vel_y, yaw_rate], scale 1.0\
        \ (lines 95-104); rate_hz 50.0 (line 11). Candidate range -1 to 1 for each\
        \ field: robot_lab's current Go2 training range (experiments/EXPERIMENTS_LOG.md,\
        \ \"E1 (research half)\"; the robot_lab commit this checkpoint was trained\
        \ at is unknown). Each range end proven by a recorded run: experiments/EXPERIMENTS_LOG.md,\
        \ \"E4 \u2014 command inventory\"."
      fields:
        vel_x:
          unit: m/s
          min: -1.0
          max: 1.0
          native_index: 0
          proven_by: artifacts/env/commands/commands.json
          measured_at_min: -0.888
          measured_at_max: 0.9243
          description: 'Forward velocity in the dog''s own heading frame (x forward):
            positive walks forward, negative walks backward. Tracking on a flat floor
            (Gate 1, experiments/EXPERIMENTS_LOG.md): commanded 0.3 / 0.6 / 0.9 m/s
            gave 0.2256 / 0.5430 / 0.8596 m/s, so 0.3 m/s runs 0.0744 m/s slow, outside
            the gate''s 20% tolerance (the one condition of Gate 1 that failed). In
            robot_lab training (HEAD; this checkpoint''s training commit is unknown)
            planar commands with norm up to 0.2 m/s were zeroed, so small commands
            may not move the dog as asked.'
        vel_y:
          unit: m/s
          min: -1.0
          max: 1.0
          native_index: 1
          proven_by: artifacts/env/commands/commands.json
          measured_at_min: -1.0349
          measured_at_max: 0.8939
          description: 'Sideways velocity in the dog''s own heading frame (y left):
            positive steps left, negative steps right. Tracking is measured only by
            the two proof runs (measured_at_min, measured_at_max). The same training
            note as vel_x applies to planar commands with norm up to 0.2 m/s.'
        yaw_rate:
          unit: rad/s
          min: -1.0
          max: 1.0
          native_index: 2
          proven_by: artifacts/env/commands/commands.json
          measured_at_min: -0.9555
          measured_at_max: 0.9687
          description: 'Turning rate about the vertical axis: positive turns anticlockwise
            (to the left) seen from above. Gate 1 measured +0.4976 / -0.5066 rad/s
            for +0.5 / -0.5 commanded at 0.3 m/s forward. With zero commanded the
            dog still turns anticlockwise at 0.05-0.14 rad/s (Gate 1). In robot_lab
            training yaw commands came from heading control.'
